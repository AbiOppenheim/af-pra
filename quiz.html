<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentforce Specialist Practice Quiz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3347;
    --accent: #7c6ef5;
    --accent-dim: #4a3fa0;
    --text: #e8eaf0;
    --text-dim: #8b90a8;
    --correct: #34c975;
    --correct-bg: #0d2e1a;
    --wrong: #f25f5c;
    --wrong-bg: #2e1212;
    --warn: #f5a623;
    --radius: 10px;
    --transition: 0.15s ease;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.3px;
  }

  header .stats {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    gap: 16px;
  }

  header .stats span { white-space: nowrap; }
  header .stats .score-good { color: var(--correct); }
  header .stats .score-bad { color: var(--wrong); }

  /* Tab bar */
  .tabs {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 4px;
  }

  .tab {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: calc(var(--radius) - 2px);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* Main card */
  .card {
    width: 100%;
    max-width: 760px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }

  .question-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .question-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.65;
    margin-bottom: 24px;
    color: var(--text);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
    text-align: left;
    transition: border-color var(--transition), background var(--transition);
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #1e2034;
  }

  .option-btn:disabled { cursor: default; }

  .option-btn .letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option-btn.correct .letter {
    background: var(--correct);
    color: #fff;
  }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option-btn.wrong .letter {
    background: var(--wrong);
    color: #fff;
  }

  /* Explanation */
  .explanation {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 24px;
    display: none;
  }

  .explanation.show { display: block; }
  .explanation .exp-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  /* Navigation */
  .nav {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .nav-left, .nav-right { display: flex; gap: 8px; }

  button.btn {
    padding: 9px 20px;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  button.btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }

  button.btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.btn.primary:hover:not(:disabled) {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #fff;
  }

  /* Jump input */
  .jump-wrap { display: flex; gap: 6px; align-items: center; }
  .jump-wrap label { font-size: 12px; color: var(--text-dim); }
  .jump-wrap input {
    width: 60px;
    padding: 7px 8px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    text-align: center;
  }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 760px;
    margin-bottom: 16px;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* Results / review view */
  .results-header {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .results-sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
    gap: 6px;
    margin-bottom: 24px;
  }

  .q-dot {
    padding: 6px 4px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: var(--transition);
  }

  .q-dot.unanswered { background: var(--surface2); color: var(--text-dim); border-color: var(--border); }
  .q-dot.correct { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .q-dot.wrong { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong); }
  .q-dot:hover { border-color: var(--accent); }

  /* Review mode banner */
  .review-banner {
    width: 100%;
    max-width: 760px;
    background: var(--warn);
    color: #1a1206;
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
  }

  .review-banner.show { display: flex; }

  /* Loading / error */
  .loading {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 48px;
    text-align: center;
  }

  /* View visibility */
  [data-view] { display: none; }
  [data-view].active { display: block; }

  /* Summary numbers */
  .summary-nums {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .summary-num {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    min-width: 100px;
    text-align: center;
  }

  .summary-num .big {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .summary-num .label { font-size: 12px; color: var(--text-dim); }
  .summary-num.good .big { color: var(--correct); }
  .summary-num.bad .big { color: var(--wrong); }
  .summary-num.neutral .big { color: var(--accent); }
</style>
</head>
<body>

<div class="loading" id="loading">Loading questions…</div>

<header id="app-header" style="display:none">
  <h1>Agentforce Specialist</h1>
  <div class="stats">
    <span id="hdr-progress">0 / 0</span>
    <span class="score-good" id="hdr-correct">✓ 0</span>
    <span class="score-bad" id="hdr-wrong">✗ 0</span>
  </div>
</header>

<div class="tabs" id="app-tabs" style="display:none">
  <button class="tab active" onclick="switchView('quiz')">Quiz</button>
  <button class="tab" onclick="switchView('results')">Results</button>
</div>

<div class="progress-wrap" id="app-progress" style="display:none">
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="review-banner" id="review-banner">
  <span>Review mode: wrong answers only (<span id="review-count">0</span> questions)</span>
  <button class="btn" onclick="exitReview()" style="padding:5px 12px;font-size:12px">Exit Review</button>
</div>

<!-- QUIZ VIEW -->
<div class="card" data-view="quiz" id="view-quiz">
  <div class="question-meta">
    <span id="q-label">Question 1</span>
    <span id="q-id-badge" style="color:var(--text-dim);font-size:11px"></span>
  </div>
  <div class="question-text" id="q-text"></div>
  <div class="options" id="q-options"></div>
  <div class="explanation" id="q-explanation">
    <div class="exp-label">Explanation</div>
    <div id="q-exp-text"></div>
  </div>
  <div class="nav">
    <div class="nav-left">
      <button class="btn" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button class="btn" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
    <div class="jump-wrap">
      <label for="jump-input">Go to</label>
      <input type="number" id="jump-input" min="1" placeholder="#" onkeydown="if(event.key==='Enter')jumpTo()">
      <button class="btn" onclick="jumpTo()">Go</button>
    </div>
  </div>
</div>

<!-- RESULTS VIEW -->
<div class="card" data-view="results" id="view-results">
  <div class="results-header">Results</div>
  <div class="results-sub" id="results-sub"></div>
  <div class="summary-nums" id="summary-nums"></div>
  <div class="results-grid" id="results-grid"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn primary" onclick="reviewWrong()">Review wrong answers</button>
    <button class="btn" onclick="resetQuiz()">Reset all progress</button>
  </div>
  <div style="border-top:1px solid var(--border);padding-top:16px">
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px">Progress backup</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" onclick="exportProgress()">Save progress file</button>
      <label class="btn" style="cursor:pointer;margin:0">
        Load progress file
        <input type="file" accept=".json" style="display:none" onchange="importProgress(event)">
      </label>
    </div>
    <div style="font-size:12px;color:var(--text-dim);margin-top:8px">Use these to back up your progress and restore it on any device.</div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'agentblazer_quiz_v1';

let questions = [];       // full question list
let queue = [];           // current ordered list of question indices into questions[]
let cursorIdx = 0;        // position in queue
let answers = {};         // { qId: { selected: 'A', correct: bool } }
let reviewMode = false;

function saveState() {
  const state = { answers, cursorIdx, reviewQueue: reviewMode ? queue.map(i => questions[i].id) : null };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    answers = s.answers || {};
    if (s.reviewQueue) {
      reviewMode = true;
      buildQueue(s.reviewQueue);
    } else {
      buildQueue(null);
      if (typeof s.cursorIdx === 'number') cursorIdx = Math.min(s.cursorIdx, queue.length - 1);
    }
  } catch(e) { answers = {}; }
}

// ─── Queue helpers ────────────────────────────────────────────────────────────
function buildQueue(ids) {
  if (ids) {
    queue = ids.map(id => questions.findIndex(q => q.id === id)).filter(i => i >= 0);
  } else {
    queue = questions.map((_, i) => i);
  }
  cursorIdx = 0;
}

function currentQuestion() { return questions[queue[cursorIdx]]; }

// ─── Stats ───────────────────────────────────────────────────────────────────
function stats() {
  const answered = Object.keys(answers).length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  const wrong = answered - correct;
  return { answered, correct, wrong, total: questions.length };
}

function wrongIds() {
  return Object.entries(answers).filter(([,a]) => !a.correct).map(([id]) => parseInt(id));
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderQuestion() {
  const q = currentQuestion();
  if (!q) return;

  document.getElementById('q-label').textContent = `Question ${cursorIdx + 1} of ${queue.length}`;
  document.getElementById('q-id-badge').textContent = `#${q.id}`;
  document.getElementById('q-text').textContent = q.question;

  // Progress bar
  const pct = queue.length > 1 ? (cursorIdx / (queue.length - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Options
  const optContainer = document.getElementById('q-options');
  optContainer.innerHTML = '';
  const prior = answers[q.id];
  const answered = !!prior;

  for (const [letter, text] of Object.entries(q.options)) {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.disabled = answered;

    if (answered) {
      if (letter === q.correctAnswer) btn.classList.add('correct');
      else if (letter === prior.selected) btn.classList.add('wrong');
    }

    btn.innerHTML = `<span class="letter">${letter}</span><span>${text}</span>`;
    btn.addEventListener('click', () => selectAnswer(letter));
    optContainer.appendChild(btn);
  }

  // Explanation
  const expEl = document.getElementById('q-explanation');
  if (answered) {
    document.getElementById('q-exp-text').textContent = q.explanation || '(No explanation available)';
    expEl.classList.add('show');
  } else {
    expEl.classList.remove('show');
  }

  // Nav buttons
  document.getElementById('btn-prev').disabled = cursorIdx === 0;
  document.getElementById('btn-next').disabled = cursorIdx === queue.length - 1;

  // Jump input placeholder
  document.getElementById('jump-input').placeholder = q.id.toString();
  document.getElementById('jump-input').value = '';

  updateHeader();
}

function updateHeader() {
  const s = stats();
  document.getElementById('hdr-progress').textContent = `${s.answered} / ${s.total}`;
  document.getElementById('hdr-correct').textContent = `✓ ${s.correct}`;
  document.getElementById('hdr-wrong').textContent = `✗ ${s.wrong}`;
}

// ─── Interaction ──────────────────────────────────────────────────────────────
function selectAnswer(letter) {
  const q = currentQuestion();
  if (answers[q.id]) return;
  const correct = letter === q.correctAnswer;
  answers[q.id] = { selected: letter, correct };
  saveState();
  renderQuestion();
}

function navigate(dir) {
  const next = cursorIdx + dir;
  if (next < 0 || next >= queue.length) return;
  cursorIdx = next;
  saveState();
  renderQuestion();
}

function jumpTo() {
  const raw = document.getElementById('jump-input').value.trim();
  const id = parseInt(raw);
  if (!id) return;
  // Jump by question ID
  const qi = queue.findIndex(i => questions[i].id === id);
  if (qi >= 0) {
    cursorIdx = qi;
    saveState();
    renderQuestion();
  } else {
    // If not in current queue, find globally
    const gi = questions.findIndex(q => q.id === id);
    if (gi >= 0) {
      exitReview();
      cursorIdx = gi;
      saveState();
      renderQuestion();
    }
  }
}

// ─── View switching ───────────────────────────────────────────────────────────
function switchView(name) {
  document.querySelectorAll('[data-view]').forEach(el => {
    el.classList.toggle('active', el.dataset.view === name);
  });
  document.querySelectorAll('.tab').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && name === 'quiz') || (i === 1 && name === 'results'));
  });
  if (name === 'results') renderResults();
  if (name === 'quiz') renderQuestion();
}

// ─── Results view ─────────────────────────────────────────────────────────────
function renderResults() {
  const s = stats();
  const pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
  const answeredPct = s.total > 0 ? Math.round((s.answered / s.total) * 100) : 0;

  document.getElementById('results-sub').textContent =
    `${s.answered} of ${s.total} questions answered (${answeredPct}%)`;

  document.getElementById('summary-nums').innerHTML = `
    <div class="summary-num neutral"><div class="big">${s.answered}</div><div class="label">Answered</div></div>
    <div class="summary-num good"><div class="big">${s.correct}</div><div class="label">Correct</div></div>
    <div class="summary-num bad"><div class="big">${s.wrong}</div><div class="label">Wrong</div></div>
    <div class="summary-num neutral"><div class="big">${pct}%</div><div class="label">Score</div></div>
  `;

  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';
  for (const q of questions) {
    const a = answers[q.id];
    const dot = document.createElement('div');
    dot.className = 'q-dot ' + (a ? (a.correct ? 'correct' : 'wrong') : 'unanswered');
    dot.textContent = q.id;
    dot.title = `Q${q.id}${a ? (a.correct ? ' ✓' : ' ✗') : ' (unanswered)'}`;
    dot.addEventListener('click', () => {
      const qi = queue.findIndex(i => questions[i].id === q.id);
      if (qi >= 0) {
        cursorIdx = qi;
      } else {
        exitReview();
        cursorIdx = questions.findIndex(qr => qr.id === q.id);
        if (cursorIdx < 0) cursorIdx = 0;
      }
      switchView('quiz');
    });
    grid.appendChild(dot);
  }
}

// ─── Review mode ─────────────────────────────────────────────────────────────
function reviewWrong() {
  const ids = wrongIds();
  if (!ids.length) { alert('No wrong answers yet!'); return; }
  // Clear wrong answers so questions can be re-attempted
  for (const id of ids) delete answers[id];
  reviewMode = true;
  buildQueue(ids);
  saveState();
  document.getElementById('review-banner').classList.add('show');
  document.getElementById('review-count').textContent = ids.length;
  switchView('quiz');
}

function exitReview() {
  reviewMode = false;
  buildQueue(null);
  saveState();
  document.getElementById('review-banner').classList.remove('show');
  renderQuestion();
}

function resetQuiz() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  answers = {};
  reviewMode = false;
  buildQueue(null);
  saveState();
  document.getElementById('review-banner').classList.remove('show');
  switchView('quiz');
}

// ─── Export / Import ─────────────────────────────────────────────────────────
function exportProgress() {
  const s = stats();
  const payload = {
    version: 1,
    savedAt: new Date().toISOString(),
    answered: s.answered,
    correct: s.correct,
    answers,
    cursorIdx,
    reviewQueue: reviewMode ? queue.map(i => questions[i].id) : null,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agentblazer-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.answers) throw new Error('Invalid file');
      answers = data.answers;
      if (data.reviewQueue) {
        reviewMode = true;
        buildQueue(data.reviewQueue);
      } else {
        reviewMode = false;
        buildQueue(null);
        if (typeof data.cursorIdx === 'number') cursorIdx = Math.min(data.cursorIdx, queue.length - 1);
      }
      saveState();
      const s = stats();
      alert(`Progress loaded: ${s.answered} answered, ${s.correct} correct.`);
      switchView('quiz');
    } catch(err) {
      alert('Could not load file — make sure it\'s a valid progress backup.');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // allow re-loading same file
}

// ─── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
  const loadEl = document.getElementById('loading');
  const DATA_SOURCES = ['app/data/unified_questions.json', 'questions.json'];
  let loaded = false;
  for (const src of DATA_SOURCES) {
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) continue;
      questions = data;
      loaded = true;
      console.log(`Loaded ${questions.length} questions from ${src}`);
      break;
    } catch (_) { /* try next source */ }
  }
  if (!loaded) {
    loadEl.innerHTML = `<strong style="color:var(--wrong)">Failed to load questions</strong><br>
      <span style="font-size:13px;color:var(--text-dim)">Expected <code>app/data/unified_questions.json</code> (pipeline output) or <code>questions.json</code> (legacy).<br>
      Run: <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">python3 -m http.server 8080</code> then open <a href="http://localhost:8080/quiz.html" style="color:var(--accent)">http://localhost:8080/quiz.html</a></span>`;
    return;
  }

  loadEl.style.display = 'none';
  document.getElementById('app-header').style.display = '';
  document.getElementById('app-tabs').style.display = '';
  document.getElementById('app-progress').style.display = '';

  loadState();
  if (!queue.length) buildQueue(null);

  // Show quiz view
  document.getElementById('view-quiz').classList.add('active');
  renderQuestion();
}

init();
</script>
</body>
</html>
